[project]
name = "health-corpus"
version = "0.2.0"
description = "Health Corpus — longitudinal personal health store, MCP windows/trends, Apple Health pattern alerts, and narrative digests."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Shawn Reddy" },
]
keywords = [
  "health-corpus",
  "apple-health",
  "health-monitoring",
  "mcp",
  "hrv",
  "telegram-bot",
  "personal-analytics",
  "anomaly-detection",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Communications :: Chat",
]

dependencies = [
  "httpx>=0.27",
  "mcp>=1.26,<2",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
openai = [
  "openai>=2.0",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.22",
  "openai>=2.0",
]

[project.urls]
Homepage = "https://github.com/Screddyice/health-corpus"
Repository = "https://github.com/Screddyice/health-corpus"
Issues = "https://github.com/Screddyice/health-corpus/issues"

[project.scripts]
health-corpus-migrate = "health_corpus.migrations.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_corpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
